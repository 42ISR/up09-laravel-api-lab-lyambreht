info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/register"
  body:
    type: json
    data: |-
      {
        "name": "Иван Петров",
        "email": "ivan@example.com",
        "password": "password123",
        "password_confirmation": "password123"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
